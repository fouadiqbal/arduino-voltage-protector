<text x="67" y="163" font-weight="bold">Voltage potentiometer</text><text x="67" y="192">A0: 0-300 V equivalent</text>
<text x="67" y="273" font-weight="bold">Current potentiometer</text><text x="67" y="302">A1: 0-20 A equivalent</text>
<text x="435" y="209" font-size="23" font-weight="bold">UNO / ATmega328P</text>
<text x="435" y="245">Sample + validate + compare</text><text x="435" y="274">Latch fault / qualify restart</text><text x="435" y="310">Nominal sample interval: 5 ms</text>
<text x="874" y="163" font-weight="bold">Green LOAD LED (D8)</text><text x="874" y="192">Represents load switch state</text>
<text x="874" y="273" font-weight="bold">Red FAULT LED (D13)</text><text x="874" y="302">Latched fault indication</text>
