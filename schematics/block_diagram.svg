<rect width="1200" height="510" fill="#f3f6fa"/>
<g font-family="Arial, sans-serif" fill="#223047">
<text x="48" y="55" font-size="30" font-weight="bold">Arduino Uno voltage protector</text>
<text x="48" y="86" font-size="17">Implemented demonstrator: USB powered, 0-5 V signals, no mains connections</text>
<g fill="white" stroke="#c8d3df" stroke-width="2">
<rect x="48" y="130" width="250" height="85" rx="12"/><rect x="48" y="240" width="250" height="85" rx="12"/>
